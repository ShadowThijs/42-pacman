[project]
name = "42-pac-man"
version = "0.1.0"
description = "A complete Pac-Man game built with pygame for the 42 curriculum"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.0",
    "mazegenerator",
    "mypy>=1.10",
    "pygame>=2.5",
]

[tool.uv.sources]
mazegenerator = { path = "maze/mazegenerator-2.0.2-py3-none-any.whl" }

[tool.mypy]
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = "mazegenerator.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
