[project]
name = "42-pac-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flake8>=7.3.0",
    "mazegenerator",
    "mypy>=2.3.0",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
]

[tool.uv.sources]
mazegenerator = { path = "maze/mazegenerator-2.0.2-py3-none-any.whl" }

[tool.mypy]
[[tool.mypy.overrides]]
module = "mazegenerator.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
